name: autotests

on:
  pull_request:
  push:
    branches:
      - main
      - v2

jobs:

  branchtest:
    runs-on: ubuntu-latest
    outputs:
      iteration: ${{ steps.branch.outputs.iteration }}

    steps:
      - name: Check branch name
        id: branch
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          iteration=0
          if [[ "$branch" =~ ^iter([1-9][0-9]*)$ ]]; then
            iteration="${BASH_REMATCH[1]}"
          elif [[ "$branch" != "main" && "$branch" != "v2" ]]; then
            echo "Branch must be iter<number>, main or v2; got $branch"
            exit 1
          fi
          echo "iteration=$iteration" >> "$GITHUB_OUTPUT"

  metricstest:
    runs-on: ubuntu-latest
    container: golang:1.26
    needs: branchtest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praktikum
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download autotests binaries
        uses: robinraju/release-downloader@v1.8
        with:
          repository: Yandex-Practicum/go-autotests
          latest: true
          fileName: "*"
          out-file-path: .tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup autotest binary
        run: |
          chmod -R +x $GITHUB_WORKSPACE/.tools
          mv $GITHUB_WORKSPACE/.tools/metricstest_v2 /usr/local/bin/metricstest
          mv $GITHUB_WORKSPACE/.tools/random /usr/local/bin/random

      - name: Setup go deps
        run: |
          go install golang.org/x/tools/cmd/goimports@latest


      - name: Build server binary
        run: |
          cd cmd/server
          go build -buildvcs=false -o server

      - name: "Code increment #1"
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v2' ||
          fromJSON(needs.branchtest.outputs.iteration) >= 1
        run: |
          metricstest -test.v -test.run=^TestIteration1$ \
            -binary-path=cmd/server/server

      - name: Build agent binary
        run: |
          cd cmd/agent
          go build -buildvcs=false  -o agent

      - name: "Code increment #2"
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v2' ||
          fromJSON(needs.branchtest.outputs.iteration) >= 2
        run: |
          metricstest -test.v -test.run=^TestIteration2[AB]*$ \
            -source-path=. \
            -agent-binary-path=cmd/agent/agent

      - name: "Code increment #3"
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v2' ||
          fromJSON(needs.branchtest.outputs.iteration) >= 3
        run: |
          metricstest -test.v -test.run=^TestIteration3[AB]*$ \
            -source-path=. \
            -agent-binary-path=cmd/agent/agent \
            -binary-path=cmd/server/server

      - name: "Code increment #4"
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v2' ||
          fromJSON(needs.branchtest.outputs.iteration) >= 4
        run: |
          SERVER_PORT=$(random unused-port)
          ADDRESS="localhost:${SERVER_PORT}"
          TEMP_FILE=$(random tempfile)
          metricstest -test.v -test.run=^TestIteration4$ \
            -agent-binary-path=cmd/agent/agent \
            -binary-path=cmd/server/server \
            -server-port=$SERVER_PORT \
            -source-path=.

      - name: "Code increment #5"
        if: |
          github.ref == 'refs/heads/main' ||
